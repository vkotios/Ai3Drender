name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Deliberately built with no secrets: the app is designed to boot on an
      # empty environment (local disk store, offline analyzer, stub mesh
      # provider). Needing a key to build would be a regression, and this step
      # is what would catch it.
      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Gated at critical rather than high on principle, not because
      # anything is currently outstanding: as of the Next 16 upgrade (#18)
      # `npm audit` reports zero vulnerabilities at any level. Keeping the
      # gate at critical (rather than tightening to zero-tolerance) avoids
      # a future moderate/high advisory with no immediate fix leaving CI
      # permanently red, which trains people to ignore it.
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical

      # Informational: surfaces any moderate and high findings in the log
      # without blocking the run.
      - name: Report all advisories
        if: always()
        run: npm audit || true
